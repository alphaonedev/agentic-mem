<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgenticMem&#8482;</title>
<meta name="description" content="AgenticMem — building in stealth.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --bg: #faf7f2; --fg: #1c1a17; --dim: #8a8378; --accent: #b4552d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  main { padding: 2rem; }
  .mark {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    margin: 0 auto 1.75rem;
    background: radial-gradient(circle at 35% 35%, #d97a4a, var(--accent));
  }
  h1 { font-size: 1.7rem; font-weight: 600; letter-spacing: -0.01em; }
  h1 sup { font-size: 0.55em; color: var(--dim); }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.25rem;
    padding: 0.4rem 0.95rem;
    border: 1px solid #e2dbd0;
    border-radius: 999px;
    font-size: 0.78rem;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .contact { margin-top: 2.5rem; font-size: 0.85rem; color: var(--dim); }
  .contact a { color: var(--fg); text-decoration: none; border-bottom: 1px solid #d8cfc2; }
  .contact a:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>AgenticMem<sup>&trade;</sup></h1>
  <div class="status"><span class="dot"></span>Stealth Mode</div>
  <p class="contact">Inquiries — <a href="mailto:justin@alpha-one.mobi">justin@alpha-one.mobi</a></p>
</main>
</body>
</html>
